name: API access check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/probe_api.py, .github/workflows/api-probe.yml]

permissions:
  contents: write

concurrency:
  group: api-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.3
      - name: Probe data.gov.in (key from secret, never echoed)
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
        run: python scripts/probe_api.py
      - name: Job summary
        if: always()
        run: test -f results/api_probe/summary.md && cat results/api_probe/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Leak check
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
        run: |
          if grep -rqF -- "$DATA_GOV_IN_API_KEY" results/ ; then echo "key found in results"; exit 1; fi
      - name: Commit probe results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/api_probe || true
          git diff --cached --quiet && exit 0
          git commit -m "data: API access probe results [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
